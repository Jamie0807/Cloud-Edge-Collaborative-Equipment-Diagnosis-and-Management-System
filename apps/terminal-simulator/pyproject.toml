[project]
name = "diagnostics-terminal-simulator"
version = "0.0.0"
requires-python = ">=3.9"

[project.scripts]
terminal-simulator = "terminal_simulator.main:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src"]
strict = true
